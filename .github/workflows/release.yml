name: Release
# Pushing a tag such as v0.1.0 builds every platform archive that install.sh
# and install.ps1 download, with SHA-256 files, and attaches them to a GitHub
# release. Each archive also carries whisper-cli, built from a pinned
# whisper.cpp by packaging/build-whisper.sh. A manual run (workflow_dispatch)
# on a branch only builds and uploads the archives as workflow artifacts; the
# publish job runs only for v* tags. Archives are not code-signed or
# notarised yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          for package in gstreamer-1.0-1.28.8-universal gstreamer-1.0-devel-1.28.8-universal; do
            # The server often cuts these large downloads, so resume until whole.
            for try in {1..40}; do
              curl -fsSL --http1.1 -C - -o "$RUNNER_TEMP/$package.pkg" "https://gstreamer.freedesktop.org/data/pkg/osx/1.28.8/$package.pkg" && break
              [[ $try -lt 40 ]] || exit 1
              sleep 10
            done
          done
          sudo installer -pkg "$RUNNER_TEMP/gstreamer-1.0-1.28.8-universal.pkg" -target /
          sudo installer -pkg "$RUNNER_TEMP/gstreamer-1.0-devel-1.28.8-universal.pkg" -target /
          echo 'PKG_CONFIG_PATH=/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,/Library/Frameworks/GStreamer.framework/Versions/1.0/lib' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg pkgconfiglite --no-progress -y
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'FFmpeg/pkg-config installation failed' }
          $installer = "$env:RUNNER_TEMP/gstreamer.exe"
          $url = 'https://gstreamer.freedesktop.org/data/pkg/windows/1.28.8/msvc/gstreamer-1.0-msvc-x86_64-1.28.8.exe'
          # The server often cuts this 540 MB download, so resume until it is whole.
          for ($try = 1; $try -le 40; $try++) {
            curl.exe -fsSL --http1.1 -C - -o $installer $url
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 40) { throw 'GStreamer download failed' }
            Start-Sleep -Seconds 10
          }
          $expected = ((curl.exe -fsSL --http1.1 --retry 5 --retry-all-errors "$url.sha256sum") -split '\s+')[0]
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'GStreamer download is damaged' }
          $root = "$env:RUNNER_TEMP/gstreamer"
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/NORESTART', '/CURRENTUSER', '/TYPE=devel', "/DIR=$root") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "GStreamer installation failed: $($process.ExitCode)" }
          "$root/bin" >> $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$($root.Replace('\','/'))/lib/pkgconfig" >> $env:GITHUB_ENV
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" >> $env:GITHUB_ENV
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked -p tehom-cli -p tehom-desktop
      - name: Build whisper-cli (pinned whisper.cpp, static)
        shell: bash
        run: packaging/build-whisper.sh target/release
      - name: Pack archive
        shell: bash
        run: packaging/release-archive.sh target/release
      - name: Smoke-test the packed binaries
        shell: bash
        run: |
          mkdir -p smoke
          if [[ -f target/dist/tehom-windows-x86_64.zip ]]; then
            ffmpeg -nostdin -v error -y -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 3 -c:v libx264 -c:a aac smoke/source.mp4
            7z x -osmoke target/dist/tehom-windows-x86_64.zip >/dev/null
            test -f smoke/tehom/vcruntime140.dll
            # Only Windows itself on PATH: the package must carry its own GStreamer.
            export PATH=/usr/bin:/c/Windows/System32
            smoke/tehom/tehom.exe --version
            smoke/tehom/whisper-cli.exe -h >/dev/null 2>&1
            timeout 120 smoke/tehom/tehom-desktop.exe --check-preview "$PWD/smoke/source.mp4"
          else
            tar -xzf target/dist/tehom-*.tar.gz -C smoke
            smoke/tehom/tehom --version
            smoke/tehom/whisper-cli -h >/dev/null 2>&1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.runner }}
          path: target/dist/
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created by hand for this tag is reused; archives are (re)attached.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Tehom $GITHUB_REF_NAME" --notes "Install: see README. Archives are SHA-256 checked by the installers but not code-signed or notarised."
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
