[package]
name = "tehom-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tehom"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
serde_json = "1"
tehom-automation = { path = "../../crates/tehom-automation" }
tehom-core = { path = "../../crates/tehom-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
