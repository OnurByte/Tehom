<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Paste a link, Tehom finds the best moments and saves them as short clips">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1726"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be95ff"/>
      <stop offset="1" stop-color="#33b1ff"/>
    </linearGradient>
    <linearGradient id="clipA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#be95ff"/><stop offset="1" stop-color="#6929c4"/>
    </linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33b1ff"/><stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
    <linearGradient id="clipC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7eb6"/><stop offset="1" stop-color="#ee5396"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 600px 250px; }
      @keyframes pulse { 50% { transform: scale(1.08); } }
      .rise1 { animation: rise 3s ease-in-out infinite; }
      .rise2 { animation: rise 3s ease-in-out .4s infinite; }
      .rise3 { animation: rise 3s ease-in-out .8s infinite; }
      @keyframes rise { 50% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .rise1, .rise2, .rise3 { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="600" cy="250" r="90" fill="#be95ff" opacity=".18" filter="url(#glow)"/>

  <text x="60" y="78" font-size="44" font-weight="700" fill="#f2f4f8">Paste a link. Get the best clips.</text>
  <text x="60" y="118" font-size="22" fill="#a8a8b3">Made on your own computer — nothing is uploaded or posted for you.</text>

  <!-- 1: the link -->
  <g transform="translate(60 200)">
    <rect width="330" height="100" rx="20" fill="#262626" stroke="#393939"/>
    <g transform="translate(26 30)" fill="none" stroke="#78a9ff" stroke-width="5" stroke-linecap="round">
      <rect x="0" y="12" width="26" height="16" rx="8"/>
      <rect x="18" y="12" width="26" height="16" rx="8"/>
    </g>
    <text x="90" y="44" font-size="20" font-weight="600" fill="#f2f4f8">youtube.com/@channel</text>
    <text x="90" y="72" font-size="16" fill="#a8a8b3">a video, a channel or a file</text>
  </g>

  <path class="flow" d="M400 250 H500" stroke="#78a9ff" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 2: local AI -->
  <g class="pulse">
    <circle cx="600" cy="250" r="62" fill="#262626" stroke="url(#accent)" stroke-width="3"/>
    <path d="M600 214 C604 238 612 246 636 250 C612 254 604 262 600 286 C596 262 588 254 564 250 C588 246 596 238 600 214 Z" fill="url(#accent)"/>
    <circle cx="632" cy="222" r="5" fill="#33b1ff"/>
  </g>
  <text x="600" y="345" font-size="17" fill="#a8a8b3" text-anchor="middle">local AI picks moments</text>

  <path class="flow" d="M700 250 H800" stroke="#78a9ff" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 3: vertical clips -->
  <g class="rise1" transform="translate(830 170)">
    <rect width="92" height="160" rx="16" fill="url(#clipA)"/>
    <path d="M38 64 L62 80 L38 96 Z" fill="#ffffff" opacity=".9"/>
    <rect x="14" y="136" width="64" height="8" rx="4" fill="#ffffff" opacity=".5"/>
  </g>
  <g class="rise2" transform="translate(940 170)">
    <rect width="92" height="160" rx="16" fill="url(#clipB)"/>
    <path d="M38 64 L62 80 L38 96 Z" fill="#ffffff" opacity=".9"/>
    <rect x="14" y="136" width="44" height="8" rx="4" fill="#ffffff" opacity=".5"/>
  </g>
  <g class="rise3" transform="translate(1050 170)">
    <rect width="92" height="160" rx="16" fill="url(#clipC)"/>
    <path d="M38 64 L62 80 L38 96 Z" fill="#ffffff" opacity=".9"/>
    <rect x="14" y="136" width="56" height="8" rx="4" fill="#ffffff" opacity=".5"/>
  </g>
  <text x="986" y="365" font-size="17" fill="#a8a8b3" text-anchor="middle">ready-to-post MP4 clips</text>
</svg>
