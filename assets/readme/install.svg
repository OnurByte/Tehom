<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="198" viewBox="0 0 1200 198" role="img" aria-label="One command to install: curl install.sh | sh on macOS and Linux, irm install.ps1 | iex on Windows">
<rect width="1200" height="198" rx="28" fill="#161616"/>
<g transform="translate(24 24)">
<rect width="564" height="150" rx="20" fill="#0b0b0f" stroke="#393939"/>
<circle cx="28" cy="26" r="6" fill="#ee5396"/><circle cx="48" cy="26" r="6" fill="#f1c21b"/><circle cx="68" cy="26" r="6" fill="#42be65"/>
<text x="540" y="31" font-size="16" font-weight="700" fill="#be95ff" text-anchor="end" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">macOS · Linux</text>
<text x="28" y="82" font-size="17" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#be95ff">$</tspan> curl -fsSL https://raw.githubusercontent.com/</text>
<text x="28" y="112" font-size="17" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#be95ff"> </tspan> OnurByte/Tehom/main/install.sh | sh</text>
</g>
<g transform="translate(612 24)">
<rect width="564" height="150" rx="20" fill="#0b0b0f" stroke="#393939"/>
<circle cx="28" cy="26" r="6" fill="#ee5396"/><circle cx="48" cy="26" r="6" fill="#f1c21b"/><circle cx="68" cy="26" r="6" fill="#42be65"/>
<text x="540" y="31" font-size="16" font-weight="700" fill="#78a9ff" text-anchor="end" font-family="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Windows</text>
<text x="28" y="82" font-size="17" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#78a9ff">PS&gt;</tspan> irm https://raw.githubusercontent.com/</text>
<text x="28" y="112" font-size="17" fill="#f2f4f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#78a9ff">   </tspan> OnurByte/Tehom/main/install.ps1 | iex</text>
</g>
</svg>
