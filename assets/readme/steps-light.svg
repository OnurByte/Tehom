<svg xmlns="http://www.w3.org/2000/svg" width="960" height="216" viewBox="0 0 960 216" role="img" aria-label="How it works: add a link, let it choose, review, save">
<defs><radialGradient id="tr" cx="1" cy="0" r="0.5" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#585858"/><stop offset="1" stop-color="#585858" stop-opacity="0"/></radialGradient><radialGradient id="bl" cx="0" cy="1" r="0.5" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#585858"/><stop offset="1" stop-color="#585858" stop-opacity="0"/></radialGradient><linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#606060"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="959" height="215" rx="12" fill="#ffffff" stroke="#b3b3b3"/>
<rect x="0.5" y="0.5" width="959" height="215" rx="12" fill="none" stroke="url(#tr)"/>
<rect x="0.5" y="0.5" width="959" height="215" rx="12" fill="none" stroke="url(#bl)"/>
<text x="32" y="52" font-size="18" font-weight="400" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">How it works</text>
<text x="32.0" y="104" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01</text>
<text x="32.0" y="132" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Add a link</text>
<text x="32.0" y="160" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">A YouTube channel, one</text>
<text x="32.0" y="182" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">video or a local file.</text>
<text x="264.0" y="104" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02</text>
<text x="264.0" y="132" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Let it choose</text>
<text x="264.0" y="160" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Your local model reads</text>
<text x="264.0" y="182" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">the captions and picks.</text>
<text x="496.0" y="104" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>
<text x="496.0" y="132" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Review</text>
<text x="496.0" y="160" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Watch each draft and</text>
<text x="496.0" y="182" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">adjust start or end.</text>
<text x="728.0" y="104" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04</text>
<text x="728.0" y="132" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">Save</text>
<text x="728.0" y="160" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">MP4 files land in your</text>
<text x="728.0" y="182" font-size="14" font-weight="400" fill="#333333" text-anchor="start" font-family="&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">folder, by hand or auto.</text>
</svg>
